networks:
  monitoring_net:
    driver: bridge

services:
  loki:
    image: grafana/loki:3.0.0
    container_name: audit_loki
    ports:
      - "3100:3100"
    volumes:
      - ./configs/loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring_net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: audit_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - monitoring_net
    depends_on:
      - loki

  node-01:
    image: ubuntu:22.04
    container_name: client_node_01
    command: bash -c "apt-get update && apt-get install -y rsyslog && tail -f /dev/null"
    volumes:
      - node01_logs:/var/log
    networks:
      - monitoring_net

  promtail:
    image: grafana/promtail:3.0.0
    container_name: audit_promtail
    volumes:
      - ./configs/promtail-config.yaml:/etc/promtail/config.yml
      - node01_logs:/var/log:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring_net
    depends_on:
      - loki
      - node-01

volumes:
  node01_logs:
